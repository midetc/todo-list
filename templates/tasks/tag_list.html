{% extends "base.html" %}

{% block title %}
  Tags
{% endblock %}

{% block content %}
  <h1>Tags <a href="{% url 'tasks:tag-create' %}" class="btn btn-primary">Add</a></h1>
  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for tag in tag_list %}
        <tr>
          <td>{{ tag.name }}</td>
          <td><a href="{% url 'tasks:tag-update' tag.pk %}">Update</a></td>
          <td><a href="{% url 'tasks:tag-delete' tag.pk %}">Delete</a></td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3">No tags yet.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
